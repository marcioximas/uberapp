databases:
  - name: hm-rent-cars-db
    plan: free
    databaseName: hm_rent_cars
    user: hm_rent_cars

services:
  - type: web
    name: hm-rent-cars
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn app:app"
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hm-rent-cars-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        value: cobranca_atraso
      - key: WHATSAPP_TEMPLATE_LANG
        value: pt_BR
      - key: WHATSAPP_API_VERSION
        value: v20.0
