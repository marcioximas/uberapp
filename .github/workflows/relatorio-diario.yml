name: Relatório diário GPS

on:
  schedule:
    # 07:00 horário de Brasília (UTC-3, sem horário de verão) = 10:00 UTC.
    # Roda aos 7min da hora (não no minuto 0) porque o GitHub atrasa bastante
    # os agendamentos no topo da hora — chega a horas de atraso, e às vezes
    # descarta o evento.
    - cron: '7 10 * * *'
  workflow_dispatch: {}

jobs:
  relatorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar relatórios e gravar no banco
        env:
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python relatorio_gps.py
