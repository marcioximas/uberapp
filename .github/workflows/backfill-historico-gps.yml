name: Backfill histórico GPS (manual)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Gravar de fato (desmarcado = só simulação, mostra o que faria sem gravar)"
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Buscar histórico e gravar no banco
        env:
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            python backfill_historico_gps.py --apply
          else
            python backfill_historico_gps.py
          fi
