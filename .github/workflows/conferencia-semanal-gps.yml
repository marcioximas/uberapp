name: Conferência semanal GPS

on:
  schedule:
    # 23:00 horário de Brasília (UTC-3, sem horário de verão) = 02:00 UTC de segunda
    - cron: '0 2 * * 1'
  workflow_dispatch: {}

jobs:
  conferencia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Conferir KM da semana x relatório diário
        env:
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python conferencia_semanal_gps.py
